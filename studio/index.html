<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Facet Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: tool chrome around a full-bleed viewport. Panels dock left/right on desktop and slide over the viewport on phones. */
:root {
  --ink-0: #0d0f12;   /* viewport surround, deepest */
  --ink-1: #14171c;   /* panels */
  --ink-2: #1b1f25;   /* raised rows, menus */
  --ink-3: #242931;   /* fields */
  --ink-4: #2e343d;   /* hover */
  --line: #2a3039;
  --text: #dde2e9;
  --dim: #8a93a1;
  --faint: #5d6573;
  --amber: #ffb547;   /* selection and active state, the 3D convention */
  --amber-ink: #1c1406;
  --blue: #6aa8ff;    /* focus and links */
  --x: #ff5d6c; --y: #93d35a; --z: #5f9dff;
  --danger: #ff6b6b;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 5px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--ink-0); color: var(--text);
  font: 12px/1.35 var(--font-ui);
  overflow: hidden; -webkit-font-smoothing: antialiased;
  user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
.ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

#app {
  height: 100%;
  display: grid;
  grid-template-columns: 236px minmax(0, 1fr) 296px;
  grid-template-rows: 38px minmax(0, 1fr) 24px;
  grid-template-areas: "top top top" "left view right" "status status status";
}

/* ── top bar ───────────────────────────── */
#top {
  grid-area: top; display: flex; align-items: center; gap: 2px;
  padding: 0 8px; background: var(--ink-1); border-bottom: 1px solid var(--line);
  position: relative; z-index: 40;
}
.brand { display: flex; align-items: center; gap: 7px; padding: 0 10px 0 4px; font-weight: 600; letter-spacing: .02em; }
.brand svg { width: 18px; height: 18px; }
.brand small { color: var(--dim); font-weight: 500; letter-spacing: .08em; text-transform: uppercase; font-size: 10px; }
.menubtn { padding: 5px 9px; border-radius: var(--r); color: var(--text); }
.menubtn:hover, .menubtn.open { background: var(--ink-3); }
.top-spacer { flex: 1; }
.searchbtn {
  display: flex; align-items: center; gap: 8px; height: 26px; padding: 0 8px 0 9px; min-width: 210px;
  background: var(--ink-2); border: 1px solid var(--line); border-radius: var(--r); color: var(--dim);
}
.searchbtn:hover { border-color: var(--ink-4); color: var(--text); }
.searchbtn kbd { margin-left: auto; }
kbd { font: 10px/1 var(--font-num); color: var(--dim); background: var(--ink-3); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 2px 4px; }
.iconbtn { width: 30px; height: 28px; display: grid; place-items: center; border-radius: var(--r); color: var(--dim); }
.iconbtn:hover { background: var(--ink-3); color: var(--text); }
.iconbtn.on { color: var(--amber); }
.iconbtn:disabled { opacity: .35; cursor: default; background: none; }
.mobile-only { display: none !important; }

/* dropdown menus */
.menu {
  position: fixed; z-index: 100; min-width: 220px; padding: 4px;
  background: var(--ink-2); border: 1px solid var(--ink-4); border-radius: 7px;
  box-shadow: 0 12px 32px rgba(0,0,0,.45);
  max-height: calc(100% - 60px); overflow: auto;
}
.menu .mi { display: flex; align-items: center; gap: 9px; width: 100%; padding: 6px 8px; border-radius: 4px; text-align: left; }
.menu .mi:hover:not(:disabled), .menu .mi.hl { background: var(--ink-4); }
.menu .mi:disabled { color: var(--faint); cursor: default; }
.menu .mi .ic { color: var(--dim); }
.menu .mi .k { margin-left: auto; color: var(--faint); font: 11px var(--font-num); padding-left: 16px; }
.menu .sep { height: 1px; background: var(--line); margin: 4px 6px; }
.menu .mh { padding: 7px 8px 3px; font-size: 10px; letter-spacing: .09em; text-transform: uppercase; color: var(--faint); }

/* ── side panels ───────────────────────── */
.panel { background: var(--ink-1); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
#left { grid-area: left; border-right: 1px solid var(--line); }
#right { grid-area: right; border-left: 1px solid var(--line); }
.phead { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-bottom: 1px solid var(--line); color: var(--dim); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; flex: none; }
.phead .grow { flex: 1; }
.pscroll { overflow: auto; min-height: 0; flex: 1; overscroll-behavior: contain; }

/* outliner */
#outliner { flex: 1 1 50%; min-height: 0; overflow: auto; padding: 4px 0; }
.orow { display: flex; align-items: center; gap: 6px; height: 24px; padding: 0 6px 0 calc(8px + var(--d, 0) * 14px); cursor: default; white-space: nowrap; }
.orow:hover { background: var(--ink-2); }
.orow.sel { background: rgba(255,181,71,.13); color: #ffe2b5; }
.orow.sel .ic.kind { color: var(--amber); }
.orow .ic.kind { color: var(--dim); }
.orow .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.orow .nm input { width: 100%; background: var(--ink-3); border: 1px solid var(--blue); border-radius: 3px; padding: 1px 4px; outline: none; }
.orow .caret { width: 12px; height: 12px; color: var(--faint); transition: transform .15s; }
.orow .caret.open { transform: rotate(90deg); }
.orow .eye { width: 22px; height: 20px; display: grid; place-items: center; color: var(--faint); border-radius: 3px; }
.orow .eye:hover { color: var(--text); background: var(--ink-3); }
.orow.hidden-obj .nm { color: var(--faint); }
.oempty { padding: 14px 12px; color: var(--faint); line-height: 1.5; }

/* add palette */
#addpal { flex: none; border-top: 1px solid var(--line); padding: 8px 8px 10px; overflow: auto; max-height: 52%; }
.addgrp { font-size: 10px; letter-spacing: .09em; text-transform: uppercase; color: var(--faint); margin: 4px 2px 6px; }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 8px; }
.tile { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 7px 2px 6px; border-radius: 5px; color: var(--dim); font-size: 10px; text-align: center; line-height: 1.15; }
.tile:hover { background: var(--ink-3); color: var(--text); }
.tile .ic { width: 20px; height: 20px; stroke-width: 1.4; }

/* properties */
.tabs { display: flex; gap: 2px; padding: 4px 6px; border-bottom: 1px solid var(--line); flex: none; overflow-x: auto; }
.tab { display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-radius: var(--r); color: var(--dim); white-space: nowrap; }
.tab:hover { color: var(--text); background: var(--ink-2); }
.tab.on { color: var(--text); background: var(--ink-3); }
.tab.on .ic { color: var(--amber); }
.sec { border-bottom: 1px solid var(--line); }
.sec > .sh { display: flex; align-items: center; gap: 6px; width: 100%; padding: 8px 10px; font-weight: 500; color: var(--text); text-align: left; }
.sec > .sh .caret { width: 12px; height: 12px; color: var(--faint); transition: transform .15s; transform: rotate(90deg); }
.sec.closed > .sh .caret { transform: none; }
.sec.closed > .sb { display: none; }
.sec > .sh .extra { margin-left: auto; display: flex; gap: 2px; }
.sb { padding: 0 10px 10px; display: grid; gap: 5px; }
.objname { display: flex; align-items: center; gap: 8px; padding: 10px; border-bottom: 1px solid var(--line); }
.objname .ic { color: var(--amber); width: 18px; height: 18px; }
.objname input { flex: 1; min-width: 0; height: 26px; background: var(--ink-3); border: 1px solid transparent; border-radius: var(--r); padding: 0 8px; font-weight: 500; }
.objname input:focus { border-color: var(--blue); outline: none; }
.pempty { padding: 18px 14px; color: var(--dim); line-height: 1.55; }
.pempty b { color: var(--text); font-weight: 500; }

/* fields */
.row { display: grid; grid-template-columns: 92px minmax(0, 1fr); align-items: center; gap: 8px; min-height: 24px; }
.row > label, .row > .lab { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vec { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px; }
.nf {
  position: relative; height: 24px; border-radius: 4px; background: var(--ink-3); overflow: hidden;
  display: flex; align-items: center; cursor: ew-resize; touch-action: none;
}
.nf:hover { background: var(--ink-4); }
.nf .fill { position: absolute; inset: 0 auto 0 0; background: rgba(106,168,255,.22); pointer-events: none; }
.nf .tx { position: relative; flex: 1; display: flex; justify-content: space-between; gap: 6px; padding: 0 7px; pointer-events: none; min-width: 0; }
.nf .tx .l { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nf .tx .v { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 11px; white-space: nowrap; }
.nf.ax .tx { justify-content: flex-start; }
.nf.ax .tx .l { width: 9px; flex: none; font-weight: 600; font-size: 10px; }
.nf.ax .tx .v { margin-left: auto; }
.nf.x .l { color: var(--x); } .nf.y .l { color: var(--y); } .nf.z .l { color: var(--z); }
.nf input { position: absolute; inset: 0; width: 100%; border: 1px solid var(--blue); border-radius: 4px; background: var(--ink-0); padding: 0 7px; font: 11px var(--font-num); outline: none; text-align: right; }
.sel-in { height: 24px; border-radius: 4px; background: var(--ink-3); border: 0; padding: 0 6px; width: 100%; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--ink-3); border-radius: 4px; padding: 2px; gap: 2px; }
.seg button { height: 20px; border-radius: 3px; color: var(--dim); font-size: 11px; white-space: nowrap; padding: 0 4px; }
.seg button:hover { color: var(--text); }
.seg button.on { background: var(--ink-0); color: var(--text); box-shadow: inset 0 0 0 1px var(--ink-4); }
.chk { display: flex; align-items: center; gap: 8px; min-height: 22px; cursor: pointer; color: var(--text); }
.chk .box { width: 15px; height: 15px; border-radius: 3px; background: var(--ink-3); display: grid; place-items: center; flex: none; }
.chk.on .box { background: var(--amber); color: var(--amber-ink); }
.chk .box .ic { width: 12px; height: 12px; stroke-width: 2.4; opacity: 0; }
.chk.on .box .ic { opacity: 1; }
.chkrow { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 8px; }
.color { display: flex; align-items: center; gap: 6px; height: 24px; }
.color .sw { position: relative; width: 44px; height: 24px; border-radius: 4px; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); flex: none; }
.color .sw input { position: absolute; inset: -8px; width: calc(100% + 16px); height: calc(100% + 16px); opacity: 0; cursor: pointer; }
.color .hex { font: 11px var(--font-num); color: var(--dim); text-transform: uppercase; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: var(--r); background: var(--ink-3); color: var(--text); white-space: nowrap; }
.btn:hover { background: var(--ink-4); }
.btn.primary { background: var(--amber); color: var(--amber-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger:hover { background: rgba(255,107,107,.18); color: #ffc3c3; }
.btns { display: flex; flex-wrap: wrap; gap: 4px; }
.btns .btn { flex: 1 1 auto; }
.note { color: var(--faint); line-height: 1.5; font-size: 11px; }
.stat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.stat div { background: var(--ink-2); border-radius: 4px; padding: 5px 7px; }
.stat b { display: block; font: 500 12px var(--font-num); font-variant-numeric: tabular-nums; }
.stat span { color: var(--faint); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; }
.presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.preset { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 2px 5px; border-radius: 6px; color: var(--dim); font-size: 10px; text-align: center; line-height: 1.15; }
.preset:hover { background: var(--ink-3); color: var(--text); }
.preset .th { width: 46px; height: 46px; border-radius: 50%; background: var(--ink-3) center/cover no-repeat; }
.modcard { background: var(--ink-2); border-radius: 6px; border: 1px solid var(--line); }
.modcard .mh2 { display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 9px; font-weight: 500; }
.modcard .mh2 .ic.kind { color: var(--blue); }
.modcard .mh2 .sp { flex: 1; }
.modcard .mb { padding: 2px 8px 8px; display: grid; gap: 5px; }
.modcard.off { opacity: .6; }
.mini { width: 24px; height: 22px; display: grid; place-items: center; border-radius: 4px; color: var(--dim); }
.mini:hover { background: var(--ink-4); color: var(--text); }
.mini.on { color: var(--amber); }
.tex { display: flex; align-items: center; gap: 6px; }
.tex img { width: 24px; height: 24px; border-radius: 3px; object-fit: cover; }

/* ── viewport ──────────────────────────── */
#view { grid-area: view; position: relative; overflow: hidden; background: #2a2e35; touch-action: none; }
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
#view.rendering #c { inset: auto; }
.vbar { position: absolute; display: flex; align-items: center; gap: 4px; z-index: 5; }
#vp-left { top: 10px; left: 10px; flex-wrap: wrap; right: 300px; }
#vp-right { top: 10px; right: 10px; }
.pill { display: flex; flex-wrap: wrap; max-width: 100%; align-items: center; gap: 2px; padding: 2px; border-radius: 7px; background: rgba(20,23,28,.86); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,.06); }
.pill button { height: 26px; min-width: 28px; padding: 0 8px; border-radius: 5px; display: flex; align-items: center; justify-content: center; gap: 6px; color: var(--dim); white-space: nowrap; }
.pill button:hover { color: var(--text); background: var(--ink-3); }
.pill button.on { color: var(--text); background: var(--ink-4); }
.pill button.on .ic { color: var(--amber); }
.pill .sepv { width: 1px; height: 18px; background: var(--line); margin: 0 2px; }
.pill .lbl { padding: 0 6px; color: var(--dim); font-size: 11px; }
.pill .mininf { width: 92px; }
.pill .mininf .nf { height: 24px; background: var(--ink-3); }
.modesel button { min-width: 64px; }
#toolbar { position: absolute; left: 10px; top: 52px; display: flex; flex-direction: column; gap: 2px; padding: 3px; z-index: 5; border-radius: 8px; background: rgba(20,23,28,.86); border: 1px solid rgba(255,255,255,.06); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
#toolbar button { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 6px; color: var(--dim); position: relative; }
#toolbar button:hover { background: var(--ink-3); color: var(--text); }
#toolbar button.on { background: var(--amber); color: var(--amber-ink); }
#toolbar .ic { width: 19px; height: 19px; }
#toolbar .tsep { height: 1px; background: var(--line); margin: 3px 4px; }
#nav { position: absolute; right: 16px; top: 190px; display: flex; flex-direction: column; gap: 6px; z-index: 5; }
#nav button { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: var(--dim); background: rgba(20,23,28,.7); border: 1px solid rgba(255,255,255,.06); touch-action: none; }
#nav button:hover { color: var(--text); background: rgba(46,52,61,.9); }
#vp-info { position: absolute; left: 56px; bottom: 12px; z-index: 5; color: rgba(221,226,233,.72); font-size: 11px; line-height: 1.5; pointer-events: none; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
#vp-info b { color: var(--text); font-weight: 500; }
#hint { pointer-events: none; position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 6; padding: 7px 12px; border-radius: 7px; background: rgba(13,15,18,.9); border: 1px solid var(--ink-4); color: var(--text); white-space: nowrap; display: flex; gap: 12px; align-items: center; max-width: calc(100% - 24px); overflow: hidden; }
#hint b { color: var(--amber); font-weight: 600; }
#hint .num { color: #fff; }
#hint .k { color: var(--dim); }
#chip { position: absolute; right: 12px; bottom: 12px; z-index: 6; padding: 6px 10px; border-radius: 7px; background: rgba(13,15,18,.85); border: 1px solid var(--ink-4); display: flex; align-items: center; gap: 10px; font-size: 11px; }
#chip .bar { width: 90px; height: 4px; border-radius: 2px; background: var(--ink-4); overflow: hidden; }
#chip .bar i { display: block; height: 100%; background: var(--amber); width: 0; }
#box { position: absolute; border: 1px dashed var(--amber); background: rgba(255,181,71,.07); z-index: 7; pointer-events: none; }
#brush { position: absolute; border: 1.5px solid rgba(255,255,255,.85); border-radius: 50%; pointer-events: none; z-index: 7; box-shadow: 0 0 0 1px rgba(0,0,0,.35); transform: translate(-50%, -50%); }
#brush.inv { border-color: #7fb7ff; }
#brush::after { content: ""; position: absolute; left: 50%; top: 50%; width: 3px; height: 3px; margin: -1.5px; border-radius: 50%; background: #fff; }
#modal-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 6; }
#drop { position: absolute; inset: 10px; border: 2px dashed var(--amber); border-radius: 12px; background: rgba(13,15,18,.7); z-index: 20; display: grid; place-items: center; font-size: 15px; color: var(--text); pointer-events: none; }
#busy { position: absolute; inset: 0; display: grid; place-items: center; z-index: 30; background: rgba(13,15,18,.55); font-size: 13px; }
#busy div { padding: 10px 16px; border-radius: 8px; background: var(--ink-2); border: 1px solid var(--ink-4); }
#boot { position: absolute; inset: 0; display: grid; place-items: center; z-index: 25; color: var(--dim); background: #2a2e35; text-align: center; padding: 24px; line-height: 1.6; }

/* render view */
#rview { position: absolute; inset: 0; z-index: 15; pointer-events: none; display: flex; flex-direction: column; }
#rview .rbar { pointer-events: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 8px 12px; background: var(--ink-1); border-bottom: 1px solid var(--line); }
#rview .rbar .ttl { font-weight: 600; }
#rview .rbar .meta { color: var(--dim); }
#rview .rbar .sp { flex: 1; }
#view.rendering { background: repeating-conic-gradient(#1d2026 0 25%, #23272e 0 50%) 0 0 / 20px 20px; }

/* ── status bar ────────────────────────── */
#status { grid-area: status; display: flex; align-items: center; gap: 16px; padding: 0 12px; background: var(--ink-1); border-top: 1px solid var(--line); color: var(--dim); font-size: 11px; white-space: nowrap; overflow: hidden; }
#status .hints { display: flex; gap: 14px; overflow: hidden; min-width: 0; }
#status .hints span { display: inline-flex; gap: 5px; align-items: center; }
#status .stats { margin-left: auto; font-family: var(--font-num); font-variant-numeric: tabular-nums; }

/* ── overlays: palette, toast, dialogs ── */
#palette { position: fixed; inset: 0; z-index: 120; background: rgba(5,6,8,.45); display: flex; justify-content: center; align-items: flex-start; padding-top: 12vh; padding-left: 16px; padding-right: 16px; }
#palette .box { width: min(560px, 100%); background: var(--ink-2); border: 1px solid var(--ink-4); border-radius: 10px; box-shadow: 0 24px 60px rgba(0,0,0,.55); overflow: hidden; }
#palette input { width: 100%; height: 46px; padding: 0 16px; background: transparent; border: 0; border-bottom: 1px solid var(--line); font-size: 15px; outline: none; }
#palette .list { max-height: 50vh; overflow: auto; padding: 4px; }
#palette .it { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; }
#palette .it.hl { background: var(--ink-4); }
#palette .it .grp { color: var(--faint); font-size: 11px; min-width: 64px; }
#palette .it .k { margin-left: auto; color: var(--faint); font: 11px var(--font-num); }
#palette .none { padding: 16px; color: var(--dim); }
#toasts { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
.toast { padding: 8px 14px; border-radius: 7px; background: var(--ink-2); border: 1px solid var(--ink-4); box-shadow: 0 8px 24px rgba(0,0,0,.4); animation: tin .18s ease-out; max-width: 90vw; }
.toast.err { border-color: rgba(255,107,107,.5); color: #ffd0d0; }
@keyframes tin { from { opacity: 0; transform: translateY(6px); } }
.dlg { position: fixed; inset: 0; z-index: 150; background: rgba(5,6,8,.55); display: grid; place-items: center; padding: 16px; }
.dlg .card { width: min(720px, 100%); max-height: calc(100% - 32px); overflow: auto; background: var(--ink-1); border: 1px solid var(--ink-4); border-radius: 12px; padding: 18px 20px; box-shadow: 0 24px 60px rgba(0,0,0,.55); }
.dlg h2 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
.dlg .sub { color: var(--dim); margin: 0 0 14px; line-height: 1.5; }
.keys { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px 22px; }
.keys h3 { margin: 0 0 6px; font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--amber); font-weight: 600; }
.keys div.k { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; border-bottom: 1px solid var(--line); }
.keys div.k span:first-child { color: var(--dim); }
.dlg .acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.dlg .grid2 { display: grid; gap: 8px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ── phones and narrow windows ─────────── */
@media (max-width: 860px) {
  #app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "top" "view" "status"; }
  #top { padding: env(safe-area-inset-top, 0px) max(6px, env(safe-area-inset-right, 0px)) 0 max(6px, env(safe-area-inset-left, 0px)); min-height: 44px; }
  .desk-only { display: none !important; }
  .mobile-only { display: grid !important; }
  .brand small { display: none; }
  .searchbtn { min-width: 0; width: 34px; padding: 0; justify-content: center; }
  .searchbtn span, .searchbtn kbd { display: none; }
  .panel { position: fixed; z-index: 60; top: calc(44px + env(safe-area-inset-top, 0px)); bottom: 0; width: min(88vw, 340px); box-shadow: 0 0 40px rgba(0,0,0,.6); transition: transform .2s ease; padding-bottom: env(safe-area-inset-bottom, 0px); }
  #left { left: 0; transform: translateX(-104%); }
  #right { right: 0; transform: translateX(104%); }
  body.show-left #left, body.show-right #right { transform: none; }
  #status { padding: 0 max(10px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(10px, env(safe-area-inset-left, 0px)); min-height: 26px; }
  #status .hints { display: none; }
  #vp-left { right: 10px; }
  #vp-right { top: auto; bottom: 64px; right: 10px; }
  #toolbar { top: auto; left: 50%; bottom: 10px; transform: translateX(-50%); flex-direction: row; max-width: calc(100% - 20px); overflow-x: auto; }
  #toolbar .tsep { width: 1px; height: auto; margin: 4px 3px; }
  #toolbar button { width: 40px; height: 40px; flex: none; }
  #nav { right: 12px; }
  #vp-info { display: none; }
  #hint { bottom: 64px; font-size: 11px; }
  #chip { bottom: 64px; right: auto; left: 10px; }
  #toasts { bottom: calc(132px + env(safe-area-inset-bottom, 0px)); width: calc(100% - 32px); }
  .pill .lbl { display: none; }
  .pill button { height: 32px; min-width: 34px; }
  .pill .lbl-t { display: none; }
  .nf { height: 30px; }
  .row { grid-template-columns: 84px minmax(0, 1fr); min-height: 30px; }
}
</style>
