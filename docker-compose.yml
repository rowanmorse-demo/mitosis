# Run the Mitosis server anywhere Docker runs:
#   docker compose up -d          # start (or apply changes after git pull: docker compose up -d --force-recreate)
#   docker compose logs -f        # watch
# Wallets, skins and purchases live in the mitosis-data volume. Put the IAP verification
# variables in a .env file next to this file (see README); compose passes them through.
services:
  mitosis:
    image: node:22-alpine
    container_name: mitosis
    working_dir: /app
    command: node server.js
    volumes:
      - ./:/app:ro
      - mitosis-data:/data
    environment:
      PORT: "3000"
      DATA_DIR: /data
      MAX_ROOMS: ${MAX_ROOMS:-}             # arena rooms of 16 games the relay may open; empty: 8
      APPLE_ISSUER_ID: ${APPLE_ISSUER_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
      APPLE_BUNDLE_ID: ${APPLE_BUNDLE_ID:-com.mitosisgame.app}
      GOOGLE_PACKAGE_NAME: ${GOOGLE_PACKAGE_NAME:-com.mitosisgame.app}
      GOOGLE_SERVICE_ACCOUNT: ${GOOGLE_SERVICE_ACCOUNT:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}          # opens /admin/net (connection report), /admin/live (live players) and /admin/pass (battle pass switch); empty: one is made in /data/admin-token
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
  # HTTPS for mitosisgame.com (Caddyfile), for a server with nothing else on ports 80 and 443: COMPOSE_PROFILES=web in
  # .env (or docker compose --profile web up -d). The OVH server already runs another project's Caddy on 80/443, so
  # there that Caddy passes mitosisgame.com to port 3000 instead and this stays off (README › Website).
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    profiles: ["web"]
    depends_on: [mitosis]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-mitosisgame.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    restart: unless-stopped
volumes:
  mitosis-data:
  caddy-data:
  caddy-config:
