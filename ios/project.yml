# Xcode project definition. Regenerate Mitosis.xcodeproj with:  xcodegen generate
# (brew install xcodegen). The committed .xcodeproj opens in Xcode without it.
name: Mitosis
options:
  bundleIdPrefix: com.mitosisgame
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 4M7HR323EA
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.2.0"
    CURRENT_PROJECT_VERSION: "4"
    # Where the app finds the Mitosis server (WebSocket relay + ATP API).
    MITOSIS_SERVER: http://51.81.81.166:3000
    # Sign in with Google: the iOS OAuth client id from Google Cloud Console (Credentials → OAuth client ID → iOS,
    # bundle id com.mitosisgame.app). Leave empty to hide the Google button. The server must list it in GOOGLE_CLIENT_IDS.
    GOOGLE_IOS_CLIENT_ID: ""
targets:
  Mitosis:
    type: application
    platform: iOS
    sources:
      - path: Mitosis
        excludes: ["Info.plist"]
      - path: ../index.html        # the whole game, bundled from the repo root
        buildPhase: resources
    info:
      path: Mitosis/Info.plist
      properties:
        CFBundleDisplayName: Mitosis
        CFBundleName: Mitosis
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.games
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true     # the game server is reached by IP over plain HTTP (see README: Deploy)
          NSAllowsArbitraryLoadsInWebContent: true   # same, for the WKWebView that runs the game
          NSAllowsLocalNetworking: true
          NSExceptionDomains:          # debug builds in the simulator may use http://localhost:3000
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
        MitosisServerURL: $(MITOSIS_SERVER)
        GoogleClientID: $(GOOGLE_IOS_CLIENT_ID)
    entitlements:
      path: Mitosis/Mitosis.entitlements
      properties:
        com.apple.developer.applesignin: [Default]     # Sign in with Apple
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mitosisgame.app
        PRODUCT_NAME: Mitosis
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
        SWIFT_STRICT_CONCURRENCY: minimal
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  MitosisTests:                      # end-to-end purchase test (see MitosisTests/PurchaseFlowTests.swift)
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MitosisTests
      - path: Mitosis/Products.storekit    # the local store the test buys from
        buildPhase: resources
    dependencies:
      - target: Mitosis
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mitosisgame.app.tests
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_TESTING_SEARCH_PATHS: YES
        SWIFT_STRICT_CONCURRENCY: minimal
schemes:
  Mitosis:
    build:
      targets:
        Mitosis: all
        MitosisTests: [test]
    run:
      config: Debug
      storeKitConfiguration: Mitosis/Products.storekit   # fake App Store for testing purchases in the simulator
    test:
      config: Debug
      storeKitConfiguration: Mitosis/Products.storekit
      targets:
        - MitosisTests
    archive:
      config: Release
