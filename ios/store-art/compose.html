<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mitosis store art</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{--void:#020809;--ink:#eaf7f3;--muted:#8fb8b2;--accent:#ff5c8a;--teal:#0d3238;--violet:#9a8cff;--display:"Bricolage Grotesque",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--void);color:var(--ink);font-family:var(--display);-webkit-font-smoothing:antialiased}
body{width:var(--w);height:var(--h);overflow:hidden;position:relative}
.bg{position:absolute;inset:0;background:
  radial-gradient(1200px 900px at var(--gx) var(--gy),rgba(255,92,138,.22),transparent 60%),
  radial-gradient(1600px 1200px at calc(100% - var(--gx)) calc(100% - var(--gy)),rgba(20,110,120,.35),transparent 65%),
  linear-gradient(135deg,#071a1e 0%,#020809 55%,#04111a 100%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(140,210,200,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(140,210,200,.07) 1px,transparent 1px);background-size:96px 96px;mask-image:radial-gradient(1400px 1000px at 50% 50%,#000 30%,transparent 100%);-webkit-mask-image:radial-gradient(1400px 1000px at 50% 50%,#000 30%,transparent 100%)}
.dots{position:absolute;inset:0;pointer-events:none}
.dots i{position:absolute;width:10px;height:10px;border-radius:2px;opacity:.55;transform:rotate(12deg)}
.copy{position:absolute;display:flex;flex-direction:column;justify-content:center;gap:30px}
.eyebrow{font:600 30px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--accent)}
h1{margin:0;font:800 118px/0.98 var(--display);letter-spacing:-.045em;color:var(--ink);text-wrap:balance}
h1 em{font-style:normal;color:var(--accent)}
.sub{margin:0;font:500 36px/1.45 var(--mono);color:var(--muted);max-width:980px}
.chips{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px}
.chip{font:600 26px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:#bfe3dc;border:2px solid rgba(140,210,200,.35);border-radius:999px;padding:16px 26px;background:rgba(0,0,0,.3)}
/* device */
.device{position:absolute;border-radius:var(--r);background:#07090a;padding:var(--bezel);
  box-shadow:0 80px 180px rgba(0,0,0,.7),0 0 0 3px rgba(140,210,200,.22),0 0 160px rgba(255,92,138,.22),inset 0 0 0 2px rgba(255,255,255,.06)}
.device img{display:block;width:100%;height:100%;object-fit:cover;border-radius:calc(var(--r) - var(--bezel))}
.device .island{position:absolute;background:#000;border-radius:999px}
.phone{--r:120px;--bezel:26px}
.phone .island{left:calc(var(--bezel) + 26px);top:50%;width:34px;height:124px;margin-top:-62px}
.tablet{--r:90px;--bezel:40px}
.tablet .island{display:none}
.foot{position:absolute;left:0;right:0;bottom:44px;text-align:center;font:600 26px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:rgba(143,184,178,.55)}
</style>
</head>
<body>
<div class="bg"></div><div class="grid"></div><div class="dots" id="dots"></div>
<div class="copy" id="copy"><div class="eyebrow" id="eyebrow"></div><h1 id="h1"></h1><p class="sub" id="sub"></p><div class="chips" id="chips"></div></div>
<div class="device" id="device"><img id="shot" alt=""><div class="island"></div></div>
<div class="foot" id="foot">Mitosis · Cell Arena</div>
<script>
const q=Object.fromEntries(new URLSearchParams(location.search));
const W=+q.w,H=+q.h,side=q.side||'right',kind=q.kind||'phone';
document.documentElement.style.setProperty('--w',W+'px');document.documentElement.style.setProperty('--h',H+'px');
document.getElementById('eyebrow').textContent=q.eyebrow||'';
document.getElementById('h1').innerHTML=(q.h1||'').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/\|/g,'<br>');
document.getElementById('sub').textContent=q.sub||'';
document.getElementById('chips').innerHTML=(q.chips||'').split('|').filter(Boolean).map(c=>`<span class="chip">${c}</span>`).join('');
const dev=document.getElementById('device');dev.classList.add(kind);document.getElementById('shot').src=q.img;
const copy=document.getElementById('copy');
// seeded pellets, like the arena's food, scattered around the edges
const dots=document.getElementById('dots');let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
const cols=['#ff5c8a','#9a8cff','#5fe0a8','#f2b134','#7ec8ff'];for(let i=0;i<70;i++){const d=document.createElement('i');d.style.left=(rnd()*100)+'%';d.style.top=(rnd()*100)+'%';d.style.background=cols[i%cols.length];d.style.opacity=(.15+rnd()*.4).toFixed(2);d.style.transform=`rotate(${(rnd()*90)|0}deg) scale(${(.6+rnd()).toFixed(2)})`;dots.appendChild(d);}
if(kind==='phone'){
  // landscape: copy on one side, the phone on the other, tilted a little
  const devW=1560,devH=Math.round(devW*1320/2868)+2*26;
  dev.style.width=devW+'px';dev.style.height=devH+'px';dev.style.top=((H-devH)/2)+'px';
  const tilt=side==='right'?'rotateY(-11deg) rotateX(3deg)':'rotateY(11deg) rotateX(3deg)';
  if(side==='right'){dev.style.right='96px';copy.style.left='160px';copy.style.width='1060px';copy.style.top='0';copy.style.height=H+'px';document.documentElement.style.setProperty('--gx','78%');document.documentElement.style.setProperty('--gy','50%');}
  else{dev.style.left='96px';copy.style.right='160px';copy.style.width='1060px';copy.style.top='0';copy.style.height=H+'px';document.documentElement.style.setProperty('--gx','22%');document.documentElement.style.setProperty('--gy','50%');}
  dev.style.transform=`perspective(4200px) ${tilt}`;
}else{
  // tablet: copy centred on top, the iPad below
  const devW=2160,devH=Math.round(devW*2064/2752)+2*40;
  dev.style.width=devW+'px';dev.style.height=devH+'px';dev.style.left=((W-devW)/2)+'px';dev.style.top=(H-devH+140)+'px';
  copy.style.left='0';copy.style.right='0';copy.style.top='110px';copy.style.height='520px';copy.style.alignItems='center';copy.style.textAlign='center';
  document.getElementById('h1').style.fontSize='128px';document.getElementById('sub').style.maxWidth='1500px';
  document.documentElement.style.setProperty('--gx','50%');document.documentElement.style.setProperty('--gy','72%');
  dev.style.transform='perspective(5000px) rotateX(6deg)';document.getElementById('foot').style.display='none';
}
window.__ready=new Promise(res=>{const img=document.getElementById('shot');const done=()=>document.fonts.ready.then(()=>setTimeout(()=>res('ok'),300));img.complete?done():(img.onload=done,img.onerror=done);});
</script>
</body>
</html>
